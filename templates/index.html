<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Aprendices</title>
</head>
<body>
    <h1>Registro de Aprendices</h1>

    <!-- Formulario para registrar -->
    <form action="/registrar" method="POST">
        <label>Nombre:</label>
        <input type="text" name="nombre" required>
        <br><br>
        <label>Correo:</label>
        <input type="email" name="correo" required>
        <br><br>
        <button type="submit">Guardar Aprendiz</button>
    </form>

    <hr>

    <h2>Lista de Aprendices</h2>
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for aprendiz in aprendices %}
            <tr>
                <td>{{ aprendiz.id }}</td>
                <td>{{ aprendiz.nombre }}</td>
                <td>{{ aprendiz.correo }}</td>
                <td>
                    <!-- Botón eliminar con formulario POST -->
                    <form action="/eliminar/{{ aprendiz.id }}" method="POST" style="margin:0;">
                        <button type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
